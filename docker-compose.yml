services:
  audio-server:
    build: .
    container_name: m5stack-audio-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      OUTPUT_DIR: /app/output
      HF_HOME: /cache/huggingface
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - huggingface:/cache/huggingface
    restart: always

volumes:
  huggingface:
